name: pdfium_flutter
description: Flutter FFI plugin for PDFium integration on Android, iOS, Windows, macOS, and Linux.
version: 0.2.1
publish_to: none
homepage: https://github.com/espresso3389/pdfrx
repository: https://github.com/espresso3389/pdfrx/tree/master/packages/pdfium_flutter
issue_tracker: https://github.com/espresso3389/pdfrx/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  pdfium_dart:
    git: https://github.com/kumsumit/pdfium_dart.git
  code_assets: ^1.2.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: ^2.0.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
